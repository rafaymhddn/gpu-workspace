version: "3.9"
services:
  gpu-workspace:
    container_name: gpu-workspace
    build: .
    restart: unless-stopped
    working_dir: /workspace
    # Enable GPUs in this container (compose supports this under deploy.resources)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1    # adjust if you want to expose more GPUs
    shm_size: "32g"      # increase shared memory for dataloaders/NCCL
    volumes:
      - ./:/workspace    # persist workspace data
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent}:/ssh-agent  # forward local SSH agent (set SSH_AUTH_SOCK to real path)
      - ~/.gitconfig:/root/.gitconfig:ro                 # use host git config
      # - ~/.cache/huggingface:/root/.cache/huggingface    # optional HF cache
      # - ~/.docker/config.json:/root/.docker/config.json:ro # optional Docker creds
    environment:
      TZ: Europe/Berlin
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility #
      SSH_AUTH_SOCK: /ssh-agent
